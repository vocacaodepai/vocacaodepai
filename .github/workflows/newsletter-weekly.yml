name: Newsletter semanal (Área do Pai)

# Resumo semanal por fase do filho (doc 07 §6.6; doc 10 §8): domingo 11:00 UTC = 08:00 Brasília.
# Chama POST /api/newsletter/weekly com Authorization: Bearer CRON_SECRET (doc 02 §8).
# Padrão dos crons da Fase 8: CRON_SECRET + variável de repositório PUBLIC_SITE_URL + workflow_dispatch.
# Disparo manual com dry_run=true só conta assinantes e segmentos, sem enviar. Sem auto-merge aqui.

on:
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só contar (true) ou enviar de verdade (false)"
        required: true
        default: "true"

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disparar /api/newsletter/weekly
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://vocacaodepai.com.br' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "Secret CRON_SECRET não configurado no repositório." >&2; exit 1; fi
          QUERY=""
          if [ "$DRY_RUN" = "true" ]; then QUERY="?dry_run=true"; fi
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            --max-time 300 "${SITE_URL%/}/api/newsletter/weekly$QUERY")
          echo "HTTP $HTTP"; cat /tmp/resp.json || true; echo
          [ "$HTTP" = "200" ]
