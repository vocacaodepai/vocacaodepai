<svg xmlns="http://www.w3.org/2000/svg" width="260" height="48" viewBox="0 0 260 48" role="img" aria-labelledby="t">
  <title id="t">Vocação de Pai</title>
  <!-- Bússola do Pai (doc 00 §7.3): quatro pontas, ponta norte com cruz, círculo vazado com "VP" -->
  <g transform="translate(0 0) scale(2)" fill="#14505C" stroke="#14505C" stroke-width="0.8" stroke-linejoin="round">
    <polygon points="12,1 9,5.6 15,5.6"/>
    <polygon points="12,23 9,18.4 15,18.4"/>
    <polygon points="23,12 18.4,9 18.4,15"/>
    <polygon points="1,12 5.6,9 5.6,15"/>
    <rect x="8" y="3.6" width="8" height="1.6" rx="0.4" fill="#D9822B" stroke="#D9822B"/>
    <circle cx="12" cy="12" r="5" fill="none" stroke="#D9822B" stroke-width="1.8"/>
    <text x="12" y="14.4" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="600" font-size="6.6" letter-spacing="-0.1" fill="#14505C" stroke="none">VP</text>
  </g>
  <!-- Logotipo: Barlow Condensed SemiBold, "Vocação de" petróleo, "Pai" âmbar (doc 00 §7.4) -->
  <text x="60" y="33" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="600" font-size="30" letter-spacing="-0.3">
    <tspan fill="#14505C">Vocação de </tspan><tspan fill="#D9822B">Pai</tspan>
  </text>
</svg>
